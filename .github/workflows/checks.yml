name: Code Quality Checks

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

env:
  PYTHON_VERSION: "3.12"
  COVERAGE_FAIL_UNDER: 80 # 커버리지 최소 기준을 환경 변수로 설정

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          key: poetry-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
          path: ~/.local/

      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      - name: Add Poetry to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          key: deps-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
          path: /home/runner/.cache/pypoetry/virtualenvs/

      - name: Install dependencies
        run: poetry install --no-root

      - name: Setup environment
        run: |
          mkdir -p envs
          echo "${{ secrets.DJANGO_ENVS }}" > envs/.local.env
          echo "DJANGO_SETTINGS_MODULE=config.settings.local" >> $GITHUB_ENV

      - name: Run code quality checks (parallel & fail-fast)
        shell: bash
        run: |
          set -euo pipefail
          pids=()
          poetry run isort . --check --diff & pids+=($!)
          poetry run black . --check & pids+=($!)
          poetry run mypy . & pids+=($!)
          status=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              status=1
            fi
          done
          exit $status

  discover-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.find-apps.outputs.matrix }}
      count: ${{ steps.find-apps.outputs.count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Find apps with tests
        id: find-apps
        shell: bash
        run: |
          set -euo pipefail
          apps=$(find apps -mindepth 1 -maxdepth 1 -type d -exec basename {} \; 2>/dev/null || echo "")
          if [ -z "$apps" ]; then
            echo "No apps found"
            echo "matrix={\"app\":[]}" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          else
            echo "Found apps: $apps"
            app_list=$(echo "$apps" | jq -R . | jq -s . | jq -c .)
            matrix_json="{\"app\":$app_list}"
            echo "matrix=$matrix_json" >> $GITHUB_OUTPUT
            echo "count=$(echo "$apps" | wc -w)" >> $GITHUB_OUTPUT
            echo "Generated matrix: $matrix_json"
          fi

  test:
    runs-on: ubuntu-latest
    needs: discover-apps
    if: needs.discover-apps.outputs.count != '0'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.discover-apps.outputs.matrix) }}
    services:
      db:
        image: postgres:14
        ports: ['5432:5432']
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pw1234
          POSTGRES_DB: ozcoding_externship
          TZ: Asia/Seoul
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:latest
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          key: poetry-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
          path: ~/.local/

      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      - name: Add Poetry to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          key: deps-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
          path: /home/runner/.cache/pypoetry/virtualenvs/

      - name: Install dependencies
        run: poetry install --no-root

      - name: Setup environment
        run: |
          mkdir -p envs
          echo "${{ secrets.DJANGO_ENVS }}" > envs/.local.env
          echo "DJANGO_SETTINGS_MODULE=config.settings.local" >> $GITHUB_ENV

      - name: Wait for services
        run: |
          timeout 30 bash -c 'until nc -z localhost 5432; do sleep 1; done'
          timeout 30 bash -c 'until nc -z localhost 6379; do sleep 1; done'

      - name: Run migrations
        run: poetry run python manage.py migrate

      - name: Run tests and check coverage for ${{ matrix.app }}
        shell: bash
        run: |
          set -eo pipefail
          app_name="${{ matrix.app }}"
          app_path="apps/$app_name"
          echo "🚀 Testing $app_name..."

          test_files=$(find "$app_path" -type f -name "test*.py")
          if [ -n "$test_files" ] && grep -q -r "def test_" $app_path; then
            echo "✅ Running tests for $app_name"
            # 1. 테스트 실행 및 병렬 데이터 파일 생성
            poetry run coverage run --parallel-mode --source="$app_path" manage.py test "apps.$app_name" --verbosity=1
            
            # 2. 현재 잡에서 생성된 병렬 데이터 파일들을 .coverage 파일로 병합
            echo "🔄 Combining coverage data for this job..."
            poetry run coverage combine
            
            echo "📊 Coverage report for $app_name:"
            # 3. 병합된 .coverage 파일을 기반으로 리포트 생성 (로그 출력용)
            poetry run coverage report -m --include="$app_path/*" || true

            echo "🔎 Validating coverage for $app_name..."
            # 4. 병합된 .coverage 파일을 기반으로 커버리지 기준 검증
            poetry run coverage report --fail-under=${{ env.COVERAGE_FAIL_UNDER }} --include="$app_path/*"
          else
            echo "⚠️ No test functions found in $app_name. Skipping coverage generation."
          fi

      - name: Upload coverage data for ${{ matrix.app }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.app }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

  finalize:
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install coverage
        run: pip install coverage

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          path: coverage-reports
          merge-multiple: true

      - name: Generate and check combined coverage report
        id: combined-coverage
        shell: bash
        run: |
          set -euo pipefail
          echo "📥 Downloaded artifacts contents into 'coverage-reports':"
          ls -laR coverage-reports/ || echo "No coverage-reports directory found."

          echo "📊 Combining coverage data from 'coverage-reports' directory..."
          coverage combine --keep coverage-reports

          if [ -f ".coverage" ]; then
            echo "✅ Coverage data combined successfully."
            
            echo "📊 Generating and Checking Combined Coverage Report:"
            # 1. 전체 커버리지 리포트를 로그에 출력
            coverage report -m
            # 2. 전체 커버리지 기준 검증 (기준 미달 시 실패)
            coverage report --fail-under=${{ env.COVERAGE_FAIL_UNDER }}
            
            coverage xml -o coverage.xml
            echo "✅ Combined coverage report generated: coverage.xml"
            echo "combined=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Failed to combine coverage data. No '.coverage' file was created."
            exit 1
          fi

      - name: Upload combined coverage artifact
        if: steps.combined-coverage.outputs.combined == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: combined-coverage-report
          path: |
            coverage.xml
            .coverage
          include-hidden-files: true
          retention-days: 30

      - name: Check overall CI status
        run: |
          if [[ "${{ needs.code-quality.result }}" == "success" && 
                ("${{ needs.test.result }}" == "success" || "${{ needs.test.result }}" == "skipped") ]]; then
            echo "✅ All CI checks passed!"
          else
            echo "❌ CI failed - Code Quality: ${{ needs.code-quality.result }}, Tests: ${{ needs.test.result }}"
            exit 1
          fi
