name: Code Quality Checks
on:
  pull_request:
    branches:
      - main
      - develop
permissions:
  contents: read
  actions: read
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
env:
  PYTHON_VERSION: "3.12"
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Configure uv cache
        uses: actions/cache@v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-cache-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-cache-${{ runner.os }}-${{ env.PYTHON_VERSION }}-
            uv-cache-${{ runner.os }}-
      - name: Install uv
        uses: astral-sh/setup-uv@v3.1.3
      - name: Install Poetry
        uses: snok/install-poetry@v1.4.1
        with:
          virtualenvs-create: false
      - name: Install Poetry export plugin
        run: poetry self add poetry-plugin-export
      - name: Export and install dependencies
        run: |
          poetry export -f requirements.txt --output requirements.txt --with dev --without-hashes
          uv venv .venv
          source .venv/bin/activate
          uv pip install -r requirements.txt
      - name: Setup environment variables file
        run: |
          mkdir -p envs
          echo "${{ secrets.DJANGO_ENVS }}" > envs/.local.env
          export PYTHONPATH="${{ github.workspace }}:$PYTHONPATH"
      - name: Run code quality checks in parallel
        run: |
          source .venv/bin/activate
          
          echo "::group::Running isort"
          timeout 300 python -m isort . --check --diff || echo "::error::isort failed"
          echo "::endgroup::"
          
          echo "::group::Running black"
          timeout 300 python -m black . --check || echo "::error::black failed"
          echo "::endgroup::"
          
          echo "::group::Running mypy"
          timeout 300 python -m mypy . || echo "::error::mypy failed"
          echo "::endgroup::"
          
          if [ $? -ne 0 ]; then
            echo "❌ Code quality checks failed"
            exit 1
          else
            echo "✅ All code quality checks passed!"
          fi
      - name: Clean up uv cache
        if: always()
        run: uv cache prune --ci || true
  discover-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Discover apps with tests
        id: set-matrix
        run: |
          echo "🔍 Discovering apps with tests..."
          app_names=()
          if [ -d "apps" ]; then
            for app_dir in apps/*/; do
              if [ -d "$app_dir" ]; then
                app_name=$(basename "$app_dir")
                app_path="apps/$app_name"
                
                test_files=$(find "$app_path" -type f \( -name "tests.py" -o -name "test_*.py" \) 2>/dev/null)
                
                if [ -n "$test_files" ] && grep -rq "def test_" "$app_path" 2>/dev/null; then
                  app_names+=("$app_name")
                  echo "  ✅ Found tests in: $app_name"
                fi
              fi
            done
          fi
          
          if [ ${#app_names[@]} -eq 0 ]; then
            echo "⚠️ No apps with tests found. Skipping tests."
            echo "matrix={}" >> $GITHUB_OUTPUT
          else
            matrix_json=$(jq -nc --argjson apps "$(printf '%s\n' "${app_names[@]}" | jq -R . | jq -s .)" '{app: $apps}')
            echo "matrix=$matrix_json" >> $GITHUB_OUTPUT
            echo "✅ Discovered ${#app_names[@]} apps: ${app_names[*]}"
          fi
  test:
    runs-on: ubuntu-latest
    needs: discover-apps
    if: needs.discover-apps.outputs.matrix != '{}'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.discover-apps.outputs.matrix) }}
    services:
      db:
        image: postgres:14
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pw1234
          POSTGRES_DB: ozcoding_externship
          TZ: Asia/Seoul
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Configure uv cache
        uses: actions/cache@v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-cache-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-cache-${{ runner.os }}-${{ env.PYTHON_VERSION }}-
            uv-cache-${{ runner.os }}-
      - name: Install uv
        uses: astral-sh/setup-uv@v3.1.3
      - name: Install Poetry
        uses: snok/install-poetry@v1.4.1
        with:
          virtualenvs-create: false
      - name: Install Poetry export plugin
        run: poetry self add poetry-plugin-export
      - name: Export and install dependencies
        run: |
          poetry export -f requirements.txt --output requirements.txt --with dev --without-hashes
          uv venv .venv
          source .venv/bin/activate
          uv pip install -r requirements.txt
          uv pip install coverage  # For coverage run
      - name: Setup environment variables file
        run: |
          mkdir -p envs
          echo "${{ secrets.DJANGO_ENVS }}" > envs/.local.env
          export PYTHONPATH="${{ github.workspace }}:$PYTHONPATH"
          export DJANGO_SETTINGS_MODULE="config.settings.local"  # Settings location
      - name: Wait for services
        run: |
          timeout 60 bash -c 'until nc -z localhost 5432; do sleep 1; done'
          timeout 60 bash -c 'until nc -z localhost 6379; do sleep 1; done'
          echo "✅ Database and Redis are ready"
      - name: Run Django migrations
        run: |
          source .venv/bin/activate
          cd ${{ github.workspace }}
          poetry run python manage.py migrate --verbosity=2
      - name: Run tests for ${{ matrix.app }}
        run: |
          source .venv/bin/activate
          cd ${{ github.workspace }}
          echo "🚀 Running tests for ${{ matrix.app }}..."
          poetry run coverage run --source="apps/${{ matrix.app }}" --append manage.py test "apps.${{ matrix.app }}" --parallel=auto --verbosity=2 || echo "::error::Tests failed for ${{ matrix.app }}"
          echo "📊 Generating coverage report for ${{ matrix.app }}..."
          poetry run coverage report -m --include="apps/${{ matrix.app }}/*"
          poetry run coverage xml -o coverage-${{ matrix.app }}.xml --include="apps/${{ matrix.app }}/*"
          echo "✅ Tests completed for ${{ matrix.app }}"
      - name: Rename coverage data file
        run: |
          if [ -f .coverage ]; then
            mv .coverage .coverage.${{ matrix.app }}
            echo "✅ Renamed .coverage to .coverage.${{ matrix.app }}"
          fi
      - name: Upload coverage artifact for ${{ matrix.app }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.app }}
          path: |
            .coverage.${{ matrix.app }}
            coverage-${{ matrix.app }}.xml
          retention-days: 1
      - name: Clean up uv cache
        if: always()
        run: uv cache prune --ci || true
  coverage-merge:
    runs-on: ubuntu-latest
    needs: test
    if: always() && needs.test.result == 'success' && needs.discover-apps.outputs.matrix != '{}'
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install coverage
        run: pip install coverage
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: true
      - name: Debug artifact contents
        run: |
          echo "📂 Artifact contents:"
          ls -la coverage-artifacts/ || echo "❌ coverage-artifacts directory not found"
          find coverage-artifacts -name ".coverage*" 2>/dev/null || echo "⚠️ No .coverage files found"
      - name: Combine coverage reports
        run: |
          echo "🔄 Combining coverage data..."
          if [ -d coverage-artifacts ] && [ -n "$(find coverage-artifacts -name '.coverage*' 2>/dev/null)" ]; then
            coverage combine coverage-artifacts/.coverage*
            coverage report -m
            coverage xml -o coverage.xml
            coverage html -d htmlcov
            echo "✅ Coverage reports generated successfully"
          else
            echo "⚠️ No coverage data files found"
            exit 0
          fi
      - name: Upload combined coverage report
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coverage-report-combined
          path: |
            htmlcov/
            coverage.xml
          retention-days: 30
  ci-success:
    runs-on: ubuntu-latest
    needs: [code-quality, discover-apps, test, coverage-merge]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Check CI results
        run: |
          if [[ "${{ needs.code-quality.result }}" == "success" && ( "${{ needs.test.result }}" == "skipped" || "${{ needs.test.result }}" == "success" ) && ( "${{ needs.coverage-merge.result }}" == "skipped" || "${{ needs.coverage-merge.result }}" == "success" ) ]]; then
            echo "✅ All CI checks passed!"
          else
            echo "❌ CI failed. Check logs for details."
            exit 1
          fi
