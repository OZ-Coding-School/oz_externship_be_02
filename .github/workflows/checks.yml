name: Code Quality Checks
on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

env:
  PYTHON_VERSION: "3.12"
  COVERAGE_FAIL_UNDER: 80

jobs:
  # 변경 파일 감지
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for relevant changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/**'
              - '**/*.py'
              - 'manage.py'
              - 'config/**'
            dependencies:
              - 'pyproject.toml'
              - 'poetry.lock'

  code-quality:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 6
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # 향상된 다단계 캐싱
      - name: Multi-layer dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/
            ~/.cache/uv/
            .venv/
          key: deps-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock', 'pyproject.toml') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ env.PYTHON_VERSION }}-
            deps-${{ runner.os }}-

      - name: Fast dependency installation
        run: |
          # Poetry 설치 (캐시된 경우 빠름)
          if [ ! -f "$HOME/.local/bin/poetry" ]; then
            curl -sSL https://install.python-poetry.org | python3 -
            ~/.local/bin/poetry self add poetry-plugin-export
          fi
          export PATH="$HOME/.local/bin:$PATH"
          
          # 빠른 export + uv 설치
          poetry export --format=requirements.txt --output=requirements.txt --with=dev --without-hashes
          
          uv venv
          uv pip sync requirements.txt

      - name: Setup environment
        run: |
          mkdir -p envs
          echo "${{ secrets.DJANGO_ENVS }}" > envs/.local.env
          echo "DJANGO_SETTINGS_MODULE=config.settings.local" >> $GITHUB_ENV

      - name: Run code quality checks (parallel & fail-fast)
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          pids=()
          isort . --check --diff & pids+=($!)
          black . --check & pids+=($!)
          mypy . & pids+=($!)
          status=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              status=1
            fi
          done
          exit $status

  test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 12
    services:
      db:
        image: postgres:14
        ports: ['5432:5432']
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pw1234
          POSTGRES_DB: ozcoding_externship
          TZ: Asia/Seoul
          # 테스트 성능 최적화 설정
          POSTGRES_INITDB_ARGS: "--auth-host=trust --auth-local=trust"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=1024m
          --shm-size=256m

      redis:
        image: redis:latest
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # 동일한 고급 캐싱
      - name: Multi-layer dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/
            ~/.cache/uv/
            .venv/
          key: deps-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock', 'pyproject.toml') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ env.PYTHON_VERSION }}-
            deps-${{ runner.os }}-

      - name: Fast dependency installation
        run: |
          if [ ! -f "$HOME/.local/bin/poetry" ]; then
            curl -sSL https://install.python-poetry.org | python3 -
            ~/.local/bin/poetry self add poetry-plugin-export
          fi
          export PATH="$HOME/.local/bin:$PATH"
          
          poetry export --format=requirements.txt --output=requirements.txt --with=dev --without-hashes
          echo "tblib" >> requirements.txt
          
          uv venv
          uv pip sync requirements.txt

      - name: Setup optimized environment
        run: |
          mkdir -p envs
          echo "${{ secrets.DJANGO_ENVS }}" > envs/.local.env
          # Django 테스트 최적화 환경변수
          echo "DJANGO_SETTINGS_MODULE=config.settings.local" >> $GITHUB_ENV
          echo "DEBUG=False" >> $GITHUB_ENV
          echo "LOGGING_DISABLE_EXISTING_LOGGERS=True" >> $GITHUB_ENV
          echo "USE_TZ=False" >> $GITHUB_ENV
          echo "PASSWORD_HASHERS=[\"django.contrib.auth.hashers.MD5PasswordHasher\"]" >> $GITHUB_ENV

      - name: Wait for services (faster timeout)
        run: |
          timeout 20 bash -c 'until nc -z localhost 5432; do sleep 1; done'
          timeout 20 bash -c 'until nc -z localhost 6379; do sleep 1; done'

      # 테스트 DB 캐싱
      - name: Cache test database
        uses: actions/cache@v4
        with:
          path: /tmp/test_db_migrated
          key: test-db-${{ runner.os }}-${{ hashFiles('apps/**/migrations/*.py') }}

      - name: Run migrations (with keepdb optimization)
        run: |
          source .venv/bin/activate
          # 첫 실행시만 마이그레이션, 이후는 스킵
          if [ ! -f "/tmp/test_db_migrated" ]; then
            python manage.py migrate
            touch /tmp/test_db_migrated
          fi

      - name: Setup coverage for parallel tests
        run: |
          source .venv/bin/activate
          # sitecustomize.py 생성
          cat > sitecustomize.py << 'EOF'
          import coverage
          coverage.process_startup()
          EOF
          
          # .coveragerc 설정
          cat > .coveragerc << 'EOF'
          [run]
          branch = False
          parallel = True
          concurrency = multiprocessing, thread
          source = apps
          omit = 
            */migrations/*
            */venv/*
            */env/*
            */node_modules/*
            manage.py
            */settings/*
            */test_*.py
            */tests.py
            */conftest.py
          
          [report]
          precision = 2
          show_missing = True
          exclude_lines =
            pragma: no cover
            def __repr__
            raise AssertionError
            raise NotImplementedError
          EOF

      # 최적화된 테스트 실행
      - name: Run optimized parallel tests with coverage
        shell: bash
        run: |
          set -eo pipefail
          source .venv/bin/activate
          echo "🚀 Django 최적화된 parallel 테스트 실행 중..."
          
          # Coverage 환경변수 설정
          export COVERAGE_PROCESS_START=./.coveragerc
          
          # 최적화된 parallel 테스트 실행
          coverage run --parallel-mode --concurrency=multiprocessing \
            manage.py test --parallel 4 --keepdb --verbosity=1 \
            --debug-mode --no-input
          
          echo "📊 Coverage 데이터 결합 중..."
          coverage combine

      - name: Generate individual app coverage reports
        shell: bash
        run: |
          set -eo pipefail
          source .venv/bin/activate
          
          echo "📋 각 앱별 개별 Coverage 리포트 생성 중..."
          
          # apps 디렉토리에서 앱 목록 찾기
          apps=$(find apps -mindepth 1 -maxdepth 1 -type d -exec basename {} \; 2>/dev/null || echo "")
          
          overall_status=0
          
          if [ -n "$apps" ]; then
            for app in $apps; do
              app_path="apps/$app"
              echo "📊 Coverage report for $app:"
              
              # 해당 앱에 테스트가 있는지 확인
              test_files=$(find "$app_path" -type f -name "test*.py" 2>/dev/null || echo "")
              if [ -n "$test_files" ] && grep -q -r "def test_" "$app_path" 2>/dev/null; then
                # 해당 앱의 coverage 리포트 생성
                coverage report -m --include="$app_path/*"

                # 해당 앱의 coverage 퍼센트 확인                
                coverage_pct=$(coverage report --include="$app_path/*" | tail -n 1 | awk '{print $4}' | tr -d '%' 2>/dev/null || echo "0")
                
                echo "📈 $app Coverage: ${coverage_pct}%"
                
                if (( ${coverage_pct%.*} >= ${{ env.COVERAGE_FAIL_UNDER }} )); then
                  echo "✅ $app: ${coverage_pct}% ≥ ${{ env.COVERAGE_FAIL_UNDER }}% — 기준 충족"
                else
                  echo "❌ $app: ${coverage_pct}% < ${{ env.COVERAGE_FAIL_UNDER }}% — 기준 미달"
                  overall_status=1
                fi
              else
                echo "⚠️ $app: No test functions found. Skipping coverage check."
              fi
              echo "---"
            done
          else
            echo "⚠️ No apps found in apps/ directory"
          fi
          
          # 전체 coverage 리포트
          echo "📊 전체 Coverage 리포트:"
          coverage report -m
          
          # 전체 coverage 퍼센트 확인
          total_coverage_pct=$(coverage report | tail -n 1 | awk '{print $4}' | tr -d '%')
          echo "📈 전체 Coverage: ${total_coverage_pct}%"
          
          if (( ${total_coverage_pct%.*} >= ${{ env.COVERAGE_FAIL_UNDER }} )); then
            echo "✅ 전체: ${total_coverage_pct}% ≥ ${{ env.COVERAGE_FAIL_UNDER }}% — 기준 충족"
          else
            echo "❌ 전체: ${total_coverage_pct}% < ${{ env.COVERAGE_FAIL_UNDER }}% — 기준 미달"
            overall_status=1
          fi
          
          # XML 리포트 생성
          coverage xml
          
          if [ $overall_status -ne 0 ]; then
            echo "❌ 일부 앱이 coverage 기준을 충족하지 못했습니다."
            exit 1
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            .coverage
          retention-days: 30

  finalize:
    runs-on: ubuntu-latest
    needs: [changes, code-quality, test]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Check overall CI status
        run: |
          # 변경사항이 없으면 성공으로 처리
          if [[ "${{ needs.changes.outputs.backend }}" == "false" ]]; then
            echo "✅ 백엔드 변경사항이 없어 테스트를 건너뛰었습니다."
            exit 0
          fi
          
          if [[ "${{ needs.code-quality.result }}" == "success" && 
                "${{ needs.test.result }}" == "success" ]]; then
            echo "✅ 모든 CI 체크가 통과했습니다!"
          else
            echo "❌ CI 실패 - Code Quality: ${{ needs.code-quality.result }}, Tests: ${{ needs.test.result }}"
            exit 1
          fi