name: Code Quality Checks
on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

env:
  PYTHON_VERSION: "3.12"
  COVERAGE_FAIL_UNDER: 80

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          key: poetry-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
          path: ~/.local/

      - name: Install Poetry and export plugin
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          ~/.local/bin/poetry self add poetry-plugin-export

      - name: Add Poetry to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Export dependencies to requirements.txt
        run: |
          poetry export --format=requirements.txt --output=requirements.txt --with=dev

      - name: Install dependencies with uv
        run: |
          uv venv
          uv pip sync requirements.txt

      - name: Setup environment
        run: |
          mkdir -p envs
          echo "${{ secrets.DJANGO_ENVS }}" > envs/.local.env
          echo "DJANGO_SETTINGS_MODULE=config.settings.local" >> $GITHUB_ENV

      - name: Run code quality checks (parallel & fail-fast)
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          pids=()
          isort . --check --diff & pids+=($!)
          black . --check & pids+=($!)
          mypy . & pids+=($!)
          status=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              status=1
            fi
          done
          exit $status

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:14
        ports: ['5432:5432']
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pw1234
          POSTGRES_DB: ozcoding_externship
          TZ: Asia/Seoul
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:latest
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          key: poetry-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
          path: ~/.local/

      - name: Install Poetry and export plugin
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          ~/.local/bin/poetry self add poetry-plugin-export

      - name: Add Poetry to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Export dependencies to requirements.txt
        run: |
          poetry export --format=requirements.txt --output=requirements.txt --with=dev
          echo "tblib" >> requirements.txt  # Django parallel 테스트용

      - name: Install dependencies with uv
        run: |
          uv venv
          uv pip sync requirements.txt

      - name: Setup environment
        run: |
          mkdir -p envs
          echo "${{ secrets.DJANGO_ENVS }}" > envs/.local.env
          echo "DJANGO_SETTINGS_MODULE=config.settings.local" >> $GITHUB_ENV

      - name: Wait for services
        run: |
          timeout 30 bash -c 'until nc -z localhost 5432; do sleep 1; done'
          timeout 30 bash -c 'until nc -z localhost 6379; do sleep 1; done'

      - name: Run migrations
        run: |
          source .venv/bin/activate
          python manage.py migrate

      - name: Setup coverage for parallel tests
        run: |
          source .venv/bin/activate
          # sitecustomize.py 생성
          cat > sitecustomize.py << 'EOF'
          import coverage
          coverage.process_startup()
          EOF
          
          # .coveragerc 설정
          cat > .coveragerc << 'EOF'
          [run]
          branch = True
          parallel = True
          concurrency = multiprocessing
          source = apps
          omit = 
            */migrations/*
            */venv/*
            */env/*
            */node_modules/*
            manage.py
            */settings/*
            */test_*.py
            */tests.py
            */conftest.py
          
          [report]
          precision = 2
          show_missing = True
          exclude_lines =
            pragma: no cover
            def __repr__
            raise AssertionError
            raise NotImplementedError
          EOF

      - name: Run parallel tests with coverage (ALL apps at once)
        shell: bash
        run: |
          set -eo pipefail
          source .venv/bin/activate
          echo "🚀 Django parallel 테스트 실행 중 (모든 앱)..."
          
          # Coverage 환경변수 설정
          export COVERAGE_PROCESS_START=./.coveragerc
          
          # 모든 테스트를 parallel로 한번에 실행
          coverage run --parallel-mode --concurrency=multiprocessing manage.py test --parallel --keepdb --verbosity=1
          
          echo "📊 Coverage 데이터 결합 중..."
          coverage combine

      - name: Generate individual app coverage reports
        shell: bash
        run: |
          set -eo pipefail
          source .venv/bin/activate
          
          echo "📋 각 앱별 개별 Coverage 리포트 생성 중..."
          
          # apps 디렉토리에서 앱 목록 찾기
          apps=$(find apps -mindepth 1 -maxdepth 1 -type d -exec basename {} \; 2>/dev/null || echo "")
          
          overall_status=0
          
          if [ -n "$apps" ]; then
            for app in $apps; do
              app_path="apps/$app"
              echo "📊 Coverage report for $app:"
              
              # 해당 앱에 테스트가 있는지 확인
              test_files=$(find "$app_path" -type f -name "test*.py" 2>/dev/null || echo "")
              if [ -n "$test_files" ] && grep -q -r "def test_" "$app_path" 2>/dev/null; then
                # 해당 앱의 coverage 리포트 생성
                coverage report -m --include="$app_path/*"
                
                # 해당 앱의 coverage 퍼센트 확인
                coverage_pct=$(coverage report --include="$app_path/*" | tail -n 1 | awk '{print $4}' | tr -d '%' 2>/dev/null || echo "0")
                
                echo "📈 $app Coverage: ${coverage_pct}%"
                
                if (( ${coverage_pct%.*} >= ${{ env.COVERAGE_FAIL_UNDER }} )); then
                  echo "✅ $app: ${coverage_pct}% ≥ ${{ env.COVERAGE_FAIL_UNDER }}% — 기준 충족"
                else
                  echo "❌ $app: ${coverage_pct}% < ${{ env.COVERAGE_FAIL_UNDER }}% — 기준 미달"
                  overall_status=1
                fi
              else
                echo "⚠️ $app: No test functions found. Skipping coverage check."
              fi
              echo "---"
            done
          else
            echo "⚠️ No apps found in apps/ directory"
          fi
          
          # 전체 coverage 리포트
          echo "📊 전체 Coverage 리포트:"
          coverage report -m
          
          total_coverage_pct=$(coverage report | tail -n 1 | awk '{print $4}' | tr -d '%')
          echo "📈 전체 Coverage: ${total_coverage_pct}%"
          
          if (( ${total_coverage_pct%.*} >= ${{ env.COVERAGE_FAIL_UNDER }} )); then
            echo "✅ 전체: ${total_coverage_pct}% ≥ ${{ env.COVERAGE_FAIL_UNDER }}% — 기준 충족"
          else
            echo "❌ 전체: ${total_coverage_pct}% < ${{ env.COVERAGE_FAIL_UNDER }}% — 기준 미달"
            overall_status=1
          fi
          
          # XML 리포트 생성
          coverage xml
          
          if [ $overall_status -ne 0 ]; then
            echo "❌ 일부 앱이 coverage 기준을 충족하지 못했습니다."
            exit 1
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            .coverage
          retention-days: 30

  finalize:
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Check overall CI status
        run: |
          if [[ "${{ needs.code-quality.result }}" == "success" && 
                "${{ needs.test.result }}" == "success" ]]; then
            echo "✅ 모든 CI 체크가 통과했습니다!"
          else
            echo "❌ CI 실패 - Code Quality: ${{ needs.code-quality.result }}, Tests: ${{ needs.test.result }}"
            exit 1
          fi
