name: Code Quality Checks

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  actions: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          key: poetry-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
          path: ~/.local/

      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      - name: Add Poetry to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          key: deps-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
          path: /home/runner/.cache/pypoetry/virtualenvs/

      - name: Install dependencies
        run: poetry install --no-root

      - name: Setup environment
        run: |
          mkdir -p envs
          echo "${{ secrets.DJANGO_ENVS }}" > envs/.local.env
          echo "DJANGO_SETTINGS_MODULE=config.settings.local" >> $GITHUB_ENV

      - name: Run code quality checks (parallel & fail-fast)
        shell: bash
        run: |
          set -euo pipefail
          pids=()
          poetry run isort . --check --diff & pids+=($!)
          poetry run black . --check & pids+=($!)
          poetry run mypy . & pids+=($!)
          status=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              status=1
            fi
          done
          exit $status

  discover-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.find-apps.outputs.matrix }}
      count: ${{ steps.find-apps.outputs.count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Find apps with tests
        id: find-apps
        shell: bash
        run: |
          set -euo pipefail
          apps=$(find apps -maxdepth 1 -mindepth 1 -type d -exec basename {} \; 2>/dev/null || echo "")
          if [ -z "$apps" ]; then
            echo "No apps found"
            echo "matrix=" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          else
            echo "Found apps: $apps"
            app_list=$(echo "$apps" | jq -R . | jq -s . | jq -c .)
            matrix_json="{\"app\":$app_list}"
            echo "matrix=$matrix_json" >> $GITHUB_OUTPUT
            echo "count=$(echo "$apps" | wc -w)" >> $GITHUB_OUTPUT
            echo "Generated matrix: $matrix_json"
          fi

  test:
    runs-on: ubuntu-latest
    needs: discover-apps
    if: needs.discover-apps.outputs.count != '0'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.discover-apps.outputs.matrix) }}
    services:
      db:
        image: postgres:14
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pw1234
          POSTGRES_DB: ozcoding_externship
          TZ: Asia/Seoul
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          key: poetry-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
          path: ~/.local/

      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      - name: Add Poetry to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          key: deps-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
          path: /home/runner/.cache/pypoetry/virtualenvs/

      - name: Install dependencies
        run: poetry install --no-root

      - name: Setup environment
        run: |
          mkdir -p envs
          echo "${{ secrets.DJANGO_ENVS }}" > envs/.local.env
          echo "DJANGO_SETTINGS_MODULE=config.settings.local" >> $GITHUB_ENV

      - name: Wait for services
        run: |
          timeout 30 bash -c 'until nc -z localhost 5432; do sleep 1; done'
          timeout 30 bash -c 'until nc -z localhost 6379; do sleep 1; done'

      - name: Run migrations
        run: poetry run python manage.py migrate

      - name: Run tests for ${{ matrix.app }}
        shell: bash
        run: |
          set -eo pipefail
          app_name="${{ matrix.app }}"
          app_path="apps/$app_name"
          echo "🚀 Testing $app_name..."
          
          # 테스트 파일 확인
          test_files=$(find "$app_path" -type f \( -name "tests.py" -o -name "test_*.py" \) 2>/dev/null)
          if [ -n "$test_files" ] && grep -q "def test_" $test_files 2>/dev/null; then
            echo "✅ Running tests for $app_name"
            # --parallel-mode 추가로 고유 파일명 생성
            poetry run coverage run --parallel-mode --source="$app_path" manage.py test "apps.$app_name" --verbosity=1
            echo "📊 Coverage for $app_name:"
            poetry run coverage report -m --include="$app_path/*" || true
            poetry run coverage xml -o "coverage-$app_name.xml" --include="$app_path/*" || true
          else
            echo "⚠️ No test functions found in $app_name"
            # 빈 XML과 더미 .coverage 파일 생성 (combine을 위해 필요)
            echo '<?xml version="1.0"?><coverage></coverage>' > "coverage-$app_name.xml"
            touch ".coverage.dummy.$app_name"
          fi
          
          # 생성된 모든 .coverage.* 파일을 루트로 이동 (하위 디렉터리 포함)
          find . -type f -name ".coverage.*" -exec mv {} . \; 2>/dev/null || true
          
          # 생성된 coverage 파일 확인
          echo "📂 Generated coverage files:"
          ls -la .coverage* 2>/dev/null || echo "No .coverage files found"

      - name: Upload coverage artifacts for ${{ matrix.app }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.app }}
          path: |
            **/coverage-${{ matrix.app }}.xml  # 재귀 검색
            **/.coverage.*                    # 모든 .coverage 파일 재귀 포함
          retention-days: 3

  finalize:
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install coverage
        run: pip install coverage

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-reports
          merge-multiple: true

      - name: Generate combined coverage report
        shell: bash
        run: |
          set -euo pipefail
          echo "📥 Downloaded artifacts contents:"
          ls -la coverage-reports/ || echo "No coverage-reports directory"
          find coverage-reports -type f -print || echo "No files found in coverage-reports"
          
          # parallel mode로 생성된 .coverage.* 파일들 확인
          coverage_files=$(find coverage-reports -type f -name ".coverage.*" 2>/dev/null || echo "")
          if [ -n "$coverage_files" ]; then
            echo "📊 Found coverage files to combine:"
            echo "$coverage_files"
            
            # coverage combine 실행 (현재 디렉터리로 복사 후)
            cp coverage-reports/.coverage.* . 2>/dev/null || true
            coverage combine || true
            
            echo "📊 Combined Coverage Report:"
            coverage report -m || true
            coverage xml -o coverage.xml || true
            echo "✅ Combined coverage generated: coverage.xml"
          else
            echo "⚠️ No raw coverage data found to combine"
            echo "This might indicate that tests were not run or parallel mode failed"
          fi

      - name: Upload combined coverage
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coverage-combined
          path: |
            coverage.xml
            coverage-reports/
          retention-days: 30

      - name: Check overall CI status
        run: |
          if [[ "${{ needs.code-quality.result }}" == "success" && 
                ("${{ needs.test.result }}" == "success" || "${{ needs.test.result }}" == "skipped") ]]; then
            echo "✅ All CI checks passed!"
          else
            echo "❌ CI failed - Code Quality: ${{ needs.code-quality.result }}, Tests: ${{ needs.test.result }}"
            exit 1
          fi
