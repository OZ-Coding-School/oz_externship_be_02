services:
  django:
    container_name: django
    env_file:
      - envs/.local.env
    build:
      context: .
    working_dir: /oz_externship
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.asgi:application
                       -k uvicorn.workers.UvicornWorker
                       -w 7
                       -b 0.0.0.0:8000
                       --timeout 90
                       --graceful-timeout 90
                       --keep-alive 75
                       --worker-tmp-dir /dev/shm
                       --access-logfile -
                       --error-logfile -
                   "
    ports:
      - "8000:8000"
    volumes:
      - .:/oz_externship
      - static_volume:/oz_externship/static
      - media_volume:/oz_externship/media
    networks:
      - ws
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    container_name: celery
    env_file:
      - envs/.local.env
    build:
      context: .
    working_dir: /oz_externship
    command: >
      sh -c "celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler & celery -A config worker -l info"
    volumes:
      - .:/oz_externship
    networks:
      - ws
    depends_on:
      - django

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - django
    volumes:
      - ./resources/nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/oz_externship/static
      - media_volume:/oz_externship/media
    networks:
      - ws

  db:
    image: postgres:14
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pw1234
      POSTGRES_ROOT_USER: postgres
      POSTGRES_DB: ozcoding_externship
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ws
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - ws
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  ws:
    driver: bridge

volumes:
  static_volume:
  media_volume:
  postgres_data: